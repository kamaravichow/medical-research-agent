[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medagent"
version = "0.1.0"
description = "Medical research agent and clinician-facing harness built on LangChain, free biomedical APIs, and TinyFish search/fetch."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langchain>=1.0",
  "langchain-anthropic>=1.0",
  "langgraph>=1.0",
  "tinyfish>=0.8",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sse-starlette>=2.0",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
# Biomedical NER (BC5CDR diseases/chemicals) + NegEx negation + abbreviation detection.
nlp = [
  "scispacy>=0.5.5,<0.6",
  "spacy>=3.7.4,<3.8",
  "negspacy==1.0.4",
  "en_ner_bc5cdr_md @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_ner_bc5cdr_md-0.5.4.tar.gz",
]
# Hugging Face models: MedCPT cross-encoder reranker and BioELECTRA-PICO.
transformers = ["transformers>=4.40", "torch>=2.2"]
ml = ["medagent[nlp,transformers]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
medagent = "medagent.cli:app"

[tool.setuptools.packages.find]
include = ["medagent*"]

[tool.setuptools.package-data]
medagent = ["web/*", "skills/library/*/SKILL.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
